name: soomit-infra

x-django-base: &django-base
  image: ${BACKEND_IMAGE:-soomit-backend:local}
  restart: unless-stopped
  env_file:
    - ../backend/.env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    GOOGLE_APPLICATION_CREDENTIALS: /app/gcs-key.json
    # Same commit SHA already used as this deploy's Docker image tag (see
    # .github/workflows/deploy-vm.yml) - surfaced here so the system-admin
    # monitoring dashboard can show it without a separate version system.
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
    DEPLOYED_AT: ${DEPLOYED_AT:-}
    FRONTEND_INTERNAL_URL: http://nextjs:3000
    REALTIME_INTERNAL_URL: http://realtime:8001
  depends_on:
    redis:
      condition: service_healthy

services:
  celery_worker:
    <<: *django-base
    volumes:
      - ../backend/gcs-key.json:/app/gcs-key.json:ro
      - ../backend/soomit-patient-firebase-admin.json:/app/soomit-patient-firebase-admin.json:ro
    command: ['celery', '-A', 'config', 'worker', '-l', 'info']

  celery_beat:
    <<: *django-base
    command:
      [
        'celery',
        '-A',
        'config',
        'beat',
        '-l',
        'info',
        '--scheduler=celery.beat:PersistentScheduler',
        '--schedule=/var/lib/celery/celerybeat-schedule',
      ]
    volumes:
      - celery_beat_data:/var/lib/celery

  django:
    <<: *django-base
    build:
      context: ../backend
    volumes:
      - ../backend/gcs-key.json:/app/gcs-key.json:ro
      - ../backend/soomit-patient-firebase-admin.json:/app/soomit-patient-firebase-admin.json:ro
    command:
      [
        'gunicorn',
        'config.wsgi:application',
        '--bind',
        '0.0.0.0:8000',
        '--workers',
        '3',
        '--timeout',
        '310',
      ]
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      redis:
        condition: service_healthy
      orthanc:
        condition: service_healthy

  nextjs:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_REALTIME_WS_URL: ${NEXT_PUBLIC_REALTIME_WS_URL:?Set NEXT_PUBLIC_REALTIME_WS_URL}
        NEXT_PUBLIC_GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
        NEXT_PUBLIC_DEPLOYED_AT: ${DEPLOYED_AT:-}
    image: ${FRONTEND_IMAGE:-soomit-frontend:local}
    container_name: soomit-infra-nextjs
    restart: unless-stopped
    env_file:
      - ../frontend/.env

  realtime:
    build:
      context: ../realtime
    image: ${REALTIME_IMAGE:-soomit-realtime:local}
    container_name: soomit-infra-realtime
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/2
      DJANGO_INTERNAL_BASE_URL: http://django:8000
      DJANGO_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-https://soomit.kro.kr,http://localhost:3000,http://127.0.0.1:3000}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: soomit-infra-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      django:
        condition: service_started
      nextjs:
        condition: service_started
      realtime:
        condition: service_started

  certbot:
    image: certbot/certbot
    container_name: soomit-infra-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  redis:
    image: redis:7-alpine
    container_name: soomit-infra-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  orthanc:
    image: orthancteam/orthanc:26.7.0
    container_name: soomit-infra-orthanc
    restart: unless-stopped
    ports:
      - '${ORTHANC_HTTP_BIND_ADDRESS:-127.0.0.1}:8042:8042'
      - '${ORTHANC_DICOM_BIND_ADDRESS:-127.0.0.1}:4242:4242'
    environment:
      DICOM_WEB_PLUGIN_ENABLED: 'true'
      WSI_PLUGIN_ENABLED: 'true'
      ORTHANC_JSON: |
        {
          "Name": "SoomIT Shared Orthanc",
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": true,
          "RegisteredUsers": {
            "${ORTHANC_USERNAME:?Set ORTHANC_USERNAME}": "${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD}"
          },
          "DicomWeb": {
            "Enable": true,
            "Root": "/dicom-web/"
          },
          "WholeSlideImaging": {
            "EnableIIIF": true,
            "OrthancPublicURL": "${ORTHANC_PUBLIC_URL:?Set ORTHANC_PUBLIC_URL}",
            "ServeOpenSeadragon": false,
            "ForcePowersOfTwoScaleFactors": true
          }
        }
    volumes:
      - orthanc_storage:/var/lib/orthanc/db
    healthcheck:
      test: ['CMD', 'python3', '/probes/test-aliveness.py']
      interval: 10s
      timeout: 5s
      retries: 10

  wsi-dicomizer:
    # One-shot conversion tool. It is intentionally profile-gated so it does
    # not alter the existing Orthanc runtime or run without an explicit slide.
    image: jodogne/orthanc-plugins:1.13.0
    profiles: ['wsi-tools']
    restart: 'no'
    environment:
      # Keep these identical to the credentials interpolated into the Orthanc
      # service above; do not read a separate backend-only environment file.
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:?Set ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD}
      WSI_SOURCE_FILE: ${WSI_SOURCE_FILE:-}
    volumes:
      - ${WSI_INPUT_DIR:-../wsi-input}:/input:ro
    depends_on:
      orthanc:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        test -n "$${WSI_SOURCE_FILE}";
        exec OrthancWSIDicomizer
        --openslide=/lib/x86_64-linux-gnu/libopenslide.so.0
        --orthanc=http://orthanc:8042/
        --username="$${ORTHANC_USERNAME}"
        --password="$${ORTHANC_PASSWORD}"
        "/input/$${WSI_SOURCE_FILE}"

volumes:
  celery_beat_data:
    name: soomit_infra_celery_beat_data
  redis_data:
    name: soomit_infra_redis_data
  orthanc_storage:
    name: soomit_infra_orthanc_storage
  certbot_conf:
    name: soomit_infra_certbot_conf
  certbot_www:
    name: soomit_infra_certbot_www
