steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        CACHE_IMAGE=gcr.io/$PROJECT_ID/ct-analysis-phase1-serve:buildcache
        docker pull "$CACHE_IMAGE" || true
        docker build --cache-from "$CACHE_IMAGE" --file Dockerfile.phase1 --tag gcr.io/$PROJECT_ID/ct-analysis-phase1-serve:$_IMAGE_TAG .
        docker tag gcr.io/$PROJECT_ID/ct-analysis-phase1-serve:$_IMAGE_TAG "$CACHE_IMAGE"
        docker push "$CACHE_IMAGE"
images:
  - gcr.io/$PROJECT_ID/ct-analysis-phase1-serve:$_IMAGE_TAG
substitutions:
  _IMAGE_TAG: latest
timeout: 3600s
options:
  machineType: E2_HIGHCPU_32
