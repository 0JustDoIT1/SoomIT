steps:
  - name: python:3.11-slim
    entrypoint: bash
    secretEnv: [HF_TOKEN]
    args:
      - -ceu
      - |
        pip install --no-cache-dir 'huggingface_hub==1.31.0'
        python - <<'PY'
        import os
        from huggingface_hub import snapshot_download

        snapshot_download(
            repo_id="paige-ai/Virchow2",
            token=os.environ["HF_TOKEN"],
            cache_dir="/workspace/.hf-cache",
        )
        PY
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        CACHE_IMAGE=gcr.io/$PROJECT_ID/pdl1-serve:buildcache
        docker pull "$CACHE_IMAGE" || true
        docker build --cache-from "$CACHE_IMAGE" --tag gcr.io/$PROJECT_ID/pdl1-serve:$_IMAGE_TAG .
        docker tag gcr.io/$PROJECT_ID/pdl1-serve:$_IMAGE_TAG "$CACHE_IMAGE"
        docker push "$CACHE_IMAGE"
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/pdl1-serve:$_IMAGE_TAG

images:
  - gcr.io/$PROJECT_ID/pdl1-serve:$_IMAGE_TAG

substitutions:
  _IMAGE_TAG: final_model

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pdl1-hf-token/versions/latest
      env: HF_TOKEN

timeout: 3600s
