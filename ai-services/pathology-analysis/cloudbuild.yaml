steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/validation-assets
        gcloud storage cp gs://soomit-bucket/models/pathology-analysis/tissue/clam_model_full.pt /workspace/validation-assets/
        gcloud storage cp gs://soomit-bucket/models/pathology-analysis/gene/clam_mutation_model_full.pt /workspace/validation-assets/
        gcloud storage cp gs://soomit-bucket/models/pathology-analysis/validation/sample_uni2h.pt /workspace/validation-assets/
  - name: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    entrypoint: bash
    args:
      - -ceu
      - |
        PYTHONPATH=/workspace python /workspace/validation/validate_official_models.py
  - name: python:3.11-slim
    entrypoint: bash
    secretEnv: [HF_TOKEN]
    args:
      - -ceu
      - |
        pip install --no-cache-dir 'huggingface_hub==0.36.0'
        python - <<'PY'
        import os
        from huggingface_hub import snapshot_download

        snapshot_download(
            repo_id="MahmoodLab/UNI2-h",
            token=os.environ["HF_TOKEN"],
            cache_dir="/workspace/.hf-cache",
        )
        PY
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/$PROJECT_ID/pathology-analysis-serve:$_IMAGE_TAG
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/pathology-analysis-serve:$_IMAGE_TAG

images:
  - gcr.io/$PROJECT_ID/pathology-analysis-serve:$_IMAGE_TAG

substitutions:
  _IMAGE_TAG: pathology-analysis-v1

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pdl1-hf-token/versions/latest
      env: HF_TOKEN

timeout: 3600s
