steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [HF_TOKEN]
    args:
      - -ceu
      - |
        docker pull gcr.io/$PROJECT_ID/medgemma-serve:buildcache || true
        DOCKER_BUILDKIT=1 docker build \
          --cache-from gcr.io/$PROJECT_ID/medgemma-serve:buildcache \
          --secret id=hf_token,env=HF_TOKEN \
          --tag gcr.io/$PROJECT_ID/medgemma-serve:$_IMAGE_TAG .
        docker tag gcr.io/$PROJECT_ID/medgemma-serve:$_IMAGE_TAG gcr.io/$PROJECT_ID/medgemma-serve:buildcache
        docker push gcr.io/$PROJECT_ID/medgemma-serve:buildcache
images:
  - gcr.io/$PROJECT_ID/medgemma-serve:$_IMAGE_TAG
substitutions:
  _IMAGE_TAG: latest
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pdl1-hf-token/versions/latest
      env: HF_TOKEN
timeout: 3600s
