services:
  db:
    image: postgres:16
    container_name: sumit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sumit}
      POSTGRES_USER: ${POSTGRES_USER:-sumit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumit_local_pw}
    ports:
      - "5432:5432"
    volumes:
      - sumit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sumit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sumit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  orthanc:
    image: orthancteam/orthanc:26.7.0
    container_name: sumit-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "8042:8042"
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      WSI_PLUGIN_ENABLED: "true"
      ORTHANC_JSON: |
        {
          "Name": "SoomIT Orthanc",
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": true,
          "RegisteredUsers": {
            "${ORTHANC_USERNAME:-orthanc}": "${ORTHANC_PASSWORD:-change-me}"
          },
          "DicomWeb": {
            "Enable": true,
            "Root": "/dicom-web/"
          },
          "WholeSlideImaging": {
            "EnableIIIF": true,
            "OrthancPublicURL": "http://127.0.0.1:8042/",
            "ServeOpenSeadragon": false,
            "ForcePowersOfTwoScaleFactors": true
          }
        }
    volumes:
      - sumit_orthanc_storage:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "python3", "/probes/test-aliveness.py"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sumit_pgdata:
  sumit_orthanc_storage:
